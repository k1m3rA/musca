name: Android 16 general UI regression tests
on:
  push:
    branches: [android16-target-api-36]
    paths: [.github/workflows/android-emulator-test.yml]
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Download test APK from release
        run: |
          mkdir -p out
          curl -fL -o musca-api36-test.apk https://github.com/k1m3rA/musca/releases/download/api36-test-1/musca-api36-test.apk
          sha256sum musca-api36-test.apk | tee out/sha.txt
          grep -q 8cdc606217b302773801d0cb62d2acc0548bf25dd313b516ec3d017be0a9018b out/sha.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare UI tests
        run: |
          echo  | base64 -d > ui_test.py
      - name: Run Android 16 UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 ui_test.py
      - name: Publish results prerelease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          echo "Android 16 UI tests: navigation, language, theme, privacy, empty API dialog, font size, rotation, background return and persistence. No ballistic solutions, weapon calibration or real sensors tested. results.json records assertions; screenshots require visual review." > notes.md
          gh release create "api36-ui-${GITHUB_RUN_NUMBER}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "General UI tests ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          for f in *; do [ "$f" = notes.md ] || gh release upload "api36-ui-${GITHUB_RUN_NUMBER}" "$f" --repo "$GITHUB_REPOSITORY" || true; done
