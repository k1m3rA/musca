name: Android API 36 test APK
on:
  push:
    branches: [android16-target-api-36]
    paths: [.github/workflows/android-test.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Prepare isolated test variant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('// id("kotlin-android") // Removed for Built-in Kotlin', 'id("org.jetbrains.kotlin.android")')
          s = s.replace('applicationId = "com.musca.app"', 'applicationId = "com.musca.app.apitest"')
          # Strip native debug symbols only in this generated test variant.
          s = s.replace('keepDebugSymbols += setOf("**/*.so")', '// Native debug symbols stripped for compact test APK')
          p.write_text(s)
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="Musca"', 'android:label="Musca API36 Test"'))
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Preference persistence tests
        run: |
          mkdir -p test
          echo  | base64 -d > test/preferences_persistence_test.dart
          flutter test test/preferences_persistence_test.dart
      - name: Build signed test APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --build-name=1.0.4-api36-prefs --build-number=9
      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$BT/apksigner" verify --verbose "$APK" | tee signature.txt
          "$BT/aapt" dump badging "$APK" | tee manifest.txt
          grep -q "name='com.musca.app.apitest'" manifest.txt
          grep -q "targetSdkVersion:'36'" manifest.txt
          grep -q "arm64-v8a" manifest.txt
          grep -q "native-code: 'arm64-v8a'$" manifest.txt
          cp "$APK" musca-api36-arm64-test.apk
          "$BT/apksigner" verify --verbose build/app/outputs/flutter-apk/app-x86_64-release.apk > emulator-signature.txt
          sha256sum musca-api36-arm64-test.apk > SHA256SUMS.txt
          flutter --version > build-info.txt
          git rev-parse HEAD >> build-info.txt
          cat signature.txt manifest.txt >> build-info.txt
      - name: Enable KVM for persistence test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare emulator persistence test
        run: |
          echo  | base64 -d > prefs_emulator.py
      - name: Verify persistence on Android16
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # Never accept new SDK licences. Existing runner licences are reused.
          sdkmanager --install 'system-images;android-36;google_apis;x86_64' emulator </dev/null
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name musca-test --package 'system-images;android-36;google_apis;x86_64' --device pixel_6 --force
          test -f "$ANDROID_AVD_HOME/musca-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd musca-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics > emulator.log 2>&1 &
          timeout 120 adb wait-for-device || { cat emulator.log; exit 1; }
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          python3 prefs_emulator.py
          adb emu kill
      - name: Publish arm64 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Android 16 test build with saved language and theme preferences, from android16-target-api-36. arm64-only for real devices, with native debug symbols stripped. Separate app: Musca API36 Test (com.musca.app.apitest). Not a Play update.

          Checks: preference widget tests, APK signature/manifest and arm64-only ABI; Android 16 x86_64 emulator install, launch and language/theme persistence after cold restart from the same source (separate emulator APK). Screenshots and results included for review.

          Not tested: this arm64 APK on a real device, real sensors, weather API, ballistic calculations or updating the Play app. If Android reports a signature conflict with an older Musca API36 Test, uninstall only that test app first (its local test data will be removed). The Play app is separate.
          NOTES
          gh release create "api36-arm64-${GITHUB_RUN_NUMBER}" musca-api36-arm64-test.apk SHA256SUMS.txt build-info.txt out/results.json out/prefs05-cold-reopen.png out/prefs08-cold-reopen-light.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Musca API36 arm64 test ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --prerelease --latest=false
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musca-api36-build-and-smoke
          path: |
            out/
            build-info.txt
            signature.txt
            manifest.txt
            emulator.log
          retention-days: 7
