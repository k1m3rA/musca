name: Android API 36 test APK
on:
  push:
    branches: [android16-target-api-36]
    paths: [.github/workflows/android-test.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Prepare isolated test variant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('// id("kotlin-android") // Removed for Built-in Kotlin', 'id("org.jetbrains.kotlin.android")')
          s = s.replace('applicationId = "com.musca.app"', 'applicationId = "com.musca.app.apitest"')
          p.write_text(s)
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="Musca"', 'android:label="Musca API36 Test"'))
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Preference persistence tests
        run: |
          mkdir -p test
          echo  | base64 -d > test/preferences_persistence_test.dart
          flutter test test/preferences_persistence_test.dart
      - name: Build signed test APK
        run: flutter build apk --release --build-name=1.0.4-api36-prefs --build-number=8
      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --verbose "$APK" | tee signature.txt
          "$BT/aapt" dump badging "$APK" | tee manifest.txt
          grep -q "name='com.musca.app.apitest'" manifest.txt
          grep -q "targetSdkVersion:'36'" manifest.txt
          grep -q "arm64-v8a" manifest.txt
          cp "$APK" musca-api36-test.apk
          sha256sum musca-api36-test.apk > SHA256SUMS.txt
          flutter --version > build-info.txt
          git rev-parse HEAD >> build-info.txt
          cat signature.txt manifest.txt >> build-info.txt
